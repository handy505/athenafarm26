<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AthenaFarm26 - 智慧溫室監控</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary: #0f1419;
            --bg-secondary: #1a1f2e;
            --bg-card: #1e2533;
            --bg-card-hover: #252d3d;
            --border: #2a3345;
            --text-primary: #e8eaed;
            --text-secondary: #8b95a5;
            --text-muted: #5a6577;
            --accent: #4ade80;
            --accent-dim: rgba(74, 222, 128, 0.15);
            --warning: #fbbf24;
            --warning-dim: rgba(251, 191, 36, 0.15);
            --danger: #ef4444;
            --danger-dim: rgba(239, 68, 68, 0.15);
            --info: #60a5fa;
            --info-dim: rgba(96, 165, 250, 0.15);
            --purple: #a78bfa;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.5;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .logo {
            font-size: 1.1em;
            font-weight: 700;
            color: var(--accent);
            letter-spacing: 0.05em;
        }

        .topbar-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 0.8em;
            color: var(--text-secondary);
        }

        .topbar-time { font-variant-numeric: tabular-nums; }

        .main {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 0;
            min-height: calc(100vh - 49px);
        }

        .content {
            padding: 20px;
            overflow-y: auto;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 0.85em;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* Zone Cards */
        .zones-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
            margin-bottom: 24px;
        }

        .zone-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            transition: all 0.2s;
        }

        .zone-card:hover {
            background: var(--bg-card-hover);
            border-color: var(--accent);
        }

        .zone-card.alert {
            border-color: var(--danger);
            background: var(--danger-dim);
        }

        .zone-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .zone-name {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .zone-icon { font-size: 1.4em; }
        .zone-label { font-size: 0.9em; font-weight: 500; }

        .zone-status {
            font-size: 0.7em;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: 500;
        }

        .zone-status.normal { background: var(--accent-dim); color: var(--accent); }
        .zone-status.warning { background: var(--warning-dim); color: var(--warning); }
        .zone-status.danger { background: var(--danger-dim); color: var(--danger); }

        /* Metrics */
        .metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .metric {
            background: var(--bg-primary);
            border-radius: 6px;
            padding: 10px 12px;
        }

        .metric-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 4px;
        }

        .metric-label {
            font-size: 0.7em;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-trend {
            font-size: 0.65em;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .metric-trend.up { color: var(--danger); }
        .metric-trend.down { color: var(--info); }
        .metric-trend.flat { color: var(--text-muted); }

        .metric-value {
            font-size: 1.4em;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
        }

        .metric-unit {
            font-size: 0.7em;
            color: var(--text-secondary);
            font-weight: 400;
        }

        .metric-bar {
            height: 3px;
            background: var(--border);
            border-radius: 2px;
            margin-top: 8px;
            overflow: hidden;
        }

        .metric-bar-fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s;
        }

        .metric-bar-fill.temp { background: var(--info); }
        .metric-bar-fill.humid { background: var(--accent); }
        .metric-bar-fill.co2 { background: var(--warning); }
        .metric-bar-fill.light { background: var(--purple); }

        /* Sparkline */
        .sparkline-container {
            height: 28px;
            margin-top: 6px;
        }

        .sparkline-container canvas {
            width: 100%;
            height: 100%;
        }

        /* Chart Panel */
        .chart-section {
            margin-bottom: 24px;
        }

        .chart-panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 20px;
        }

        .chart-controls {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .chart-btn-group {
            display: flex;
            gap: 4px;
            background: var(--bg-primary);
            border-radius: 6px;
            padding: 3px;
        }

        .chart-btn {
            padding: 6px 12px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.75em;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .chart-btn:hover { color: var(--text-primary); }
        .chart-btn.active { background: var(--accent); color: var(--bg-primary); font-weight: 500; }

        .chart-label {
            font-size: 0.75em;
            color: var(--text-muted);
        }

        .chart-wrapper {
            position: relative;
            height: 280px;
        }

        /* Controls */
        .controls-section { margin-bottom: 24px; }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .control-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .control-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .control-name { font-size: 0.8em; color: var(--text-secondary); }

        .control-mode {
            font-size: 0.7em;
            padding: 2px 8px;
            border-radius: 4px;
            background: var(--accent-dim);
            color: var(--accent);
        }

        .control-buttons {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .ctrl-btn {
            padding: 8px 12px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.8em;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .ctrl-btn:hover { border-color: var(--accent); color: var(--text-primary); }

        .ctrl-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: var(--bg-primary);
            font-weight: 500;
        }

        .slider-control {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
        }

        .slider-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .slider-name { font-size: 0.8em; color: var(--text-secondary); }

        .slider-value {
            font-size: 0.8em;
            font-weight: 600;
            color: var(--accent);
        }

        input[type="range"] {
            width: 100%;
            height: 4px;
            -webkit-appearance: none;
            background: var(--border);
            border-radius: 2px;
            outline: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
        }

        /* Sidebar */
        .sidebar {
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            display: flex;
            flex-direction: column;
        }

        .sidebar-section {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-title {
            font-size: 0.75em;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 12px;
        }

        .alert-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 300px;
            overflow-y: auto;
        }

        .alert-item {
            display: flex;
            gap: 10px;
            padding: 10px;
            background: var(--bg-card);
            border-radius: 6px;
            border-left: 3px solid var(--danger);
        }

        .alert-item.warning { border-left-color: var(--warning); }
        .alert-item.info { border-left-color: var(--info); }

        .alert-time {
            font-size: 0.7em;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .alert-msg {
            font-size: 0.8em;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .stat-item {
            background: var(--bg-card);
            border-radius: 6px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.2em;
            font-weight: 600;
            color: var(--accent);
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 0.65em;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .quick-actions {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .quick-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-btn:hover { border-color: var(--accent); color: var(--text-primary); }
        .quick-btn-icon { font-size: 1.1em; }

        @media (max-width: 1024px) {
            .main { grid-template-columns: 1fr; }
            .sidebar { border-left: none; border-top: 1px solid var(--border); }
        }

        @media (max-width: 640px) {
            .zones-grid { grid-template-columns: 1fr; }
            .controls-grid { grid-template-columns: 1fr; }
            .topbar { padding: 10px 16px; }
            .content { padding: 16px; }
            .chart-controls { flex-direction: column; align-items: flex-start; }
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-left">
            <div class="logo">ATHENAFARM26</div>
            <div class="topbar-status">
                <span class="status-dot"></span>
                <span>系統運作中</span>
            </div>
        </div>
        <div class="topbar-right">
            <span id="alertCount">0 筆異常</span>
            <span class="topbar-time" id="currentTime">--:--:--</span>
        </div>
    </header>

    <div class="main">
        <div class="content">
            <!-- Zone Cards -->
            <div class="section-header">
                <span class="section-title">區域監控 / Zones</span>
            </div>
            <div class="zones-grid" id="zonesGrid"></div>

            <!-- Time Series Chart -->
            <div class="chart-section">
                <div class="section-header">
                    <span class="section-title">歷史趨勢 / Trends</span>
                </div>
                <div class="chart-panel">
                    <div class="chart-controls">
                        <span class="chart-label">時間</span>
                        <div class="chart-btn-group" id="timeRangeGroup">
                            <button class="chart-btn active" onclick="setTimeRange('30m')">30m</button>
                            <button class="chart-btn" onclick="setTimeRange('1h')">1h</button>
                            <button class="chart-btn" onclick="setTimeRange('6h')">6h</button>
                            <button class="chart-btn" onclick="setTimeRange('24h')">24h</button>
                        </div>
                        <span class="chart-label">指標</span>
                        <div class="chart-btn-group" id="metricGroup">
                            <button class="chart-btn active" onclick="setMetric('temp')">溫度</button>
                            <button class="chart-btn" onclick="setMetric('humidity')">濕度</button>
                            <button class="chart-btn" onclick="setMetric('co2')">CO₂</button>
                            <button class="chart-btn" onclick="setMetric('light')">光照</button>
                        </div>
                        <span class="chart-label">區域</span>
                        <div class="chart-btn-group" id="zoneGroup">
                            <button class="chart-btn active" onclick="setChartZone(-1)">全部</button>
                        </div>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls-section">
                <div class="section-header">
                    <span class="section-title">設備控制 / Controls</span>
                </div>
                <div class="controls-grid">
                    <div class="control-card">
                        <div class="control-header">
                            <span class="control-name">通風系統</span>
                            <span class="control-mode" id="ventMode">自然</span>
                        </div>
                        <div class="control-buttons">
                            <button class="ctrl-btn active" onclick="setVent('natural')">自然通風</button>
                            <button class="ctrl-btn" onclick="setVent('force')">強制通風</button>
                            <button class="ctrl-btn" onclick="setVent('off')">關閉</button>
                        </div>
                    </div>
                    <div class="slider-control">
                        <div class="slider-header">
                            <span class="slider-name">霧化系統</span>
                            <span class="slider-value" id="mistingVal">50%</span>
                        </div>
                        <input type="range" id="misting" min="0" max="100" value="50" oninput="updateMisting(this.value)">
                    </div>
                    <div class="slider-control">
                        <div class="slider-header">
                            <span class="slider-name">遮陽系統</span>
                            <span class="slider-value" id="shadeVal">30%</span>
                        </div>
                        <input type="range" id="shade" min="0" max="100" value="30" oninput="updateShade(this.value)">
                    </div>
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <div class="sidebar">
            <div class="sidebar-section">
                <div class="sidebar-title">即時狀態</div>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="stat-value" id="avgTemp">--</div>
                        <div class="stat-label">平均溫度 °C</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="avgHumid">--</div>
                        <div class="stat-label">平均濕度 %</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="avgCO2">--</div>
                        <div class="stat-label">平均 CO₂</div>
                    </div>
                    <div class="stat-item">
                        <div class="stat-value" id="avgLight">--</div>
                        <div class="stat-label">平均光照 k</div>
                    </div>
                </div>
            </div>

            <div class="sidebar-section" style="flex: 1; overflow: hidden;">
                <div class="sidebar-title">異常紀錄</div>
                <div class="alert-list" id="alertList">
                    <div class="alert-item info">
                        <div>
                            <div class="alert-time">--:--</div>
                            <div class="alert-msg">系統初始化中...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="sidebar-section">
                <div class="sidebar-title">快速操作</div>
                <div class="quick-actions">
                    <button class="quick-btn" onclick="emergencyStop()">
                        <span class="quick-btn-icon">⚠️</span>
                        <span>緊急停止</span>
                    </button>
                    <button class="quick-btn" onclick="exportData()">
                        <span class="quick-btn-icon">📊</span>
                        <span>匯出數據</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const zoneConfig = [
            { name: '葉菜區', nameEn: 'Leafy Greens', icon: '🥬', temp: [18, 24], humidity: [70, 85] },
            { name: '果菜區', nameEn: 'Fruiting Crops', icon: '🍅', temp: [22, 28], humidity: [60, 75] },
            { name: '育苗區', nameEn: 'Seedlings', icon: '🌱', temp: [18, 22], humidity: [80, 95] }
        ];

        const COLORS = {
            zones: ['#60a5fa', '#4ade80', '#fbbf24'],
            zonesDim: ['rgba(96,165,250,0.2)', 'rgba(74,222,128,0.2)', 'rgba(251,191,36,0.2)']
        };

        const METRIC_CONFIG = {
            temp:      { label: '溫度', unit: '°C', color: '#60a5fa', min: 10, max: 40 },
            humidity:  { label: '濕度', unit: '%',  color: '#4ade80', min: 40,  max: 100 },
            co2:       { label: 'CO₂', unit: 'ppm', color: '#fbbf24', min: 200, max: 1000 },
            light:     { label: '光照', unit: 'k lux', color: '#a78bfa', min: 0, max: 30 }
        };

        const TIME_RANGES = {
            '30m': 30 * 60 * 1000,
            '1h':  60 * 60 * 1000,
            '6h':  6 * 60 * 60 * 1000,
            '24h': 24 * 60 * 60 * 1000
        };

        let ghData = [];
        let ventMode = 'natural';
        let alerts = [];
        let historyData = [];
        let trendChart = null;
        let chartMetric = 'temp';
        let chartTimeRange = '30m';
        let chartZone = -1;

        function randomInRange(min, max) {
            return min + Math.random() * (max - min);
        }

        function clamp(val, min, max) {
            return Math.max(min, Math.min(max, val));
        }

        function generateZoneData(config) {
            return {
                ...config,
                currentTemp: randomInRange(config.temp[0], config.temp[1]),
                currentHumidity: randomInRange(config.humidity[0], config.humidity[1]),
                co2: randomInRange(400, 800),
                light: randomInRange(10000, 25000),
                prevTemp: null,
                prevHumidity: null
            };
        }

        function getZoneStatus(zone) {
            const tempLow = zone.temp[0] - 2;
            const tempHigh = zone.temp[1] + 2;
            if (zone.currentTemp < tempLow || zone.currentTemp > tempHigh) return 'danger';
            if (zone.currentTemp < zone.temp[0] || zone.currentTemp > zone.temp[1]) return 'warning';
            return 'normal';
        }

        function getStatusLabel(status) {
            return { normal: '正常', warning: '注意', danger: '異常' }[status] || '正常';
        }

        function getTrend(current, prev) {
            if (prev === null || prev === undefined) return 'flat';
            const diff = current - prev;
            if (Math.abs(diff) < 0.1) return 'flat';
            return diff > 0 ? 'up' : 'down';
        }

        function getTrendIcon(trend) {
            return { up: '↑', down: '↓', flat: '→' }[trend] || '→';
        }

        // ===== History & Sparkline =====
        function recordHistory() {
            const point = { time: Date.now(), zones: ghData.map(d => ({
                temp: d.currentTemp,
                humidity: d.currentHumidity,
                co2: d.co2,
                light: d.light
            }))};
            historyData.push(point);
            const cutoff = Date.now() - TIME_RANGES['24h'];
            while (historyData.length > 0 && historyData[0].time < cutoff) {
                historyData.shift();
            }
        }

        function getHistorySlice(metric, zoneIdx, rangeMs) {
            const cutoff = Date.now() - rangeMs;
            const slice = historyData.filter(p => p.time >= cutoff);
            if (zoneIdx === -1) {
                return {
                    datasets: zoneConfig.map((z, zi) => ({
                        label: z.name,
                        data: slice.map(p => ({
                            x: p.time,
                            y: metric === 'light' ? p.zones[zi][metric] / 1000 : p.zones[zi][metric]
                        })),
                        borderColor: COLORS.zones[zi],
                        backgroundColor: COLORS.zonesDim[zi],
                        borderWidth: 1.5,
                        pointRadius: 0,
                        tension: 0.3,
                        fill: false
                    }))
                };
            }
            return {
                datasets: [{
                    label: zoneConfig[zoneIdx].name,
                    data: slice.map(p => ({
                        x: p.time,
                        y: metric === 'light' ? p.zones[zoneIdx][metric] / 1000 : p.zones[zoneIdx][metric]
                    })),
                    borderColor: METRIC_CONFIG[metric].color,
                    backgroundColor: METRIC_CONFIG[metric].color + '33',
                    borderWidth: 2,
                    pointRadius: 0,
                    tension: 0.3,
                    fill: true
                }]
            };
        }

        function drawSparkline(canvas, data, color) {
            const ctx = canvas.getContext('2d');
            const w = canvas.width = canvas.offsetWidth * 2;
            const h = canvas.height = canvas.offsetHeight * 2;
            ctx.clearRect(0, 0, w, h);
            if (data.length < 2) return;

            const min = Math.min(...data);
            const max = Math.max(...data);
            const range = max - min || 1;
            const pad = 4;

            ctx.beginPath();
            ctx.strokeStyle = color;
            ctx.lineWidth = 2;
            ctx.lineJoin = 'round';

            data.forEach((v, i) => {
                const x = (i / (data.length - 1)) * w;
                const y = h - pad - ((v - min) / range) * (h - pad * 2);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            const grad = ctx.createLinearGradient(0, 0, 0, h);
            grad.addColorStop(0, color + '40');
            grad.addColorStop(1, color + '00');

            ctx.lineTo(w, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            ctx.fillStyle = grad;
            ctx.fill();
        }

        function updateSparklines() {
            const rangeMs = 30 * 60 * 1000;
            const cutoff = Date.now() - rangeMs;
            zoneConfig.forEach((z, zi) => {
                ['temp', 'humidity', 'co2', 'light'].forEach(metric => {
                    const canvas = document.getElementById(`spark-${zi}-${metric}`);
                    if (!canvas) return;
                    const data = historyData
                        .filter(p => p.time >= cutoff)
                        .map(p => metric === 'light' ? p.zones[zi][metric] / 1000 : p.zones[zi][metric]);
                    drawSparkline(canvas, data, METRIC_CONFIG[metric].color);
                });
            });
        }

        // ===== Trend Chart =====
        function initChart() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            trendChart = new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 300 },
                    interaction: { intersect: false, mode: 'index' },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: { color: '#8b95a5', font: { size: 11 }, boxWidth: 12, padding: 16 }
                        },
                        tooltip: {
                            backgroundColor: '#1e2533',
                            titleColor: '#e8eaed',
                            bodyColor: '#8b95a5',
                            borderColor: '#2a3345',
                            borderWidth: 1,
                            padding: 10,
                            callbacks: {
                                title: items => {
                                    if (!items.length) return '';
                                    const d = items[0].parsed.x;
                                    return new Date(d).toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
                                },
                                label: item => ` ${item.dataset.label}: ${item.parsed.y.toFixed(1)} ${METRIC_CONFIG[chartMetric].unit}`
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'timeseries',
                            time: { displayFormats: { minute: 'HH:mm', hour: 'HH:mm' } },
                            grid: { color: '#2a3345' },
                            ticks: { color: '#5a6577', font: { size: 10 }, maxTicksLimit: 8 }
                        },
                        y: {
                            grid: { color: '#2a3345' },
                            ticks: { color: '#5a6577', font: { size: 10 } }
                        }
                    }
                }
            });
        }

        function updateChart() {
            if (!trendChart) return;
            const data = getHistorySlice(chartMetric, chartZone, TIME_RANGES[chartTimeRange]);
            trendChart.data = data;
            trendChart.options.scales.y.min = METRIC_CONFIG[chartMetric].min;
            trendChart.options.scales.y.max = METRIC_CONFIG[chartMetric].max;
            trendChart.update('none');
        }

        function setTimeRange(range) {
            chartTimeRange = range;
            document.querySelectorAll('#timeRangeGroup .chart-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`#timeRangeGroup .chart-btn[onclick="setTimeRange('${range}')"]`).classList.add('active');
            updateChart();
        }

        function setMetric(metric) {
            chartMetric = metric;
            document.querySelectorAll('#metricGroup .chart-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`#metricGroup .chart-btn[onclick="setMetric('${metric}')"]`).classList.add('active');
            updateChart();
        }

        function setChartZone(idx) {
            chartZone = idx;
            document.querySelectorAll('#zoneGroup .chart-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            updateChart();
        }

        function buildZoneButtons() {
            const group = document.getElementById('zoneGroup');
            zoneConfig.forEach((z, i) => {
                const btn = document.createElement('button');
                btn.className = 'chart-btn';
                btn.textContent = z.name;
                btn.onclick = () => setChartZone(i);
                group.appendChild(btn);
            });
        }

        // ===== Alerts =====
        function addAlert(message, type = 'danger') {
            const now = new Date();
            const timeStr = now.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' });
            alerts.unshift({ time: timeStr, message, type });
            if (alerts.length > 30) alerts.pop();
            renderAlerts();
        }

        function renderAlerts() {
            const el = document.getElementById('alertList');
            document.getElementById('alertCount').textContent = `${alerts.length} 筆異常`;
            if (alerts.length === 0) {
                el.innerHTML = `<div class="alert-item info"><div><div class="alert-time">${new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' })}</div><div class="alert-msg">系統正常運作中</div></div></div>`;
                return;
            }
            el.innerHTML = alerts.slice(0, 15).map(a => `
                <div class="alert-item ${a.type}"><div><div class="alert-time">${a.time}</div><div class="alert-msg">${a.message}</div></div></div>
            `).join('');
        }

        // ===== Render =====
        function renderZones() {
            const grid = document.getElementById('zonesGrid');
            grid.innerHTML = ghData.map((d, i) => {
                const status = getZoneStatus(d);
                const tempTrend = getTrend(d.currentTemp, d.prevTemp);
                const humidTrend = getTrend(d.currentHumidity, d.prevHumidity);
                const tempPercent = ((d.currentTemp - 10) / 30) * 100;
                const humidPercent = d.currentHumidity;

                return `
                    <div class="zone-card ${status === 'danger' ? 'alert' : ''}">
                        <div class="zone-header">
                            <div class="zone-name">
                                <span class="zone-icon">${d.icon}</span>
                                <span class="zone-label">${d.name}</span>
                            </div>
                            <span class="zone-status ${status}">${getStatusLabel(status)}</span>
                        </div>
                        <div class="metrics-grid">
                            <div class="metric">
                                <div class="metric-top">
                                    <span class="metric-label">溫度</span>
                                    <span class="metric-trend ${tempTrend}">${getTrendIcon(tempTrend)}</span>
                                </div>
                                <div class="metric-value" id="temp-${i}">${d.currentTemp.toFixed(1)}<span class="metric-unit">°C</span></div>
                                <div class="metric-bar"><div class="metric-bar-fill temp" style="width: ${clamp(tempPercent, 0, 100)}%"></div></div>
                                <div class="sparkline-container"><canvas id="spark-${i}-temp"></canvas></div>
                            </div>
                            <div class="metric">
                                <div class="metric-top">
                                    <span class="metric-label">濕度</span>
                                    <span class="metric-trend ${humidTrend}">${getTrendIcon(humidTrend)}</span>
                                </div>
                                <div class="metric-value" id="humid-${i}">${d.currentHumidity.toFixed(0)}<span class="metric-unit">%</span></div>
                                <div class="metric-bar"><div class="metric-bar-fill humid" style="width: ${clamp(humidPercent, 0, 100)}%"></div></div>
                                <div class="sparkline-container"><canvas id="spark-${i}-humidity"></canvas></div>
                            </div>
                            <div class="metric">
                                <div class="metric-top">
                                    <span class="metric-label">CO₂</span>
                                    <span class="metric-trend flat">→</span>
                                </div>
                                <div class="metric-value" id="co2-${i}">${d.co2.toFixed(0)}<span class="metric-unit">ppm</span></div>
                                <div class="metric-bar"><div class="metric-bar-fill co2" style="width: ${clamp((d.co2 / 1000) * 100, 0, 100)}%"></div></div>
                                <div class="sparkline-container"><canvas id="spark-${i}-co2"></canvas></div>
                            </div>
                            <div class="metric">
                                <div class="metric-top">
                                    <span class="metric-label">光照</span>
                                    <span class="metric-trend flat">→</span>
                                </div>
                                <div class="metric-value" id="light-${i}">${(d.light / 1000).toFixed(1)}<span class="metric-unit">k lux</span></div>
                                <div class="metric-bar"><div class="metric-bar-fill light" style="width: ${clamp((d.light / 30000) * 100, 0, 100)}%"></div></div>
                                <div class="sparkline-container"><canvas id="spark-${i}-light"></canvas></div>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
            updateSparklines();
        }

        function updateValues() {
            ghData.forEach((d, i) => {
                const el = (id) => document.getElementById(id);
                if (el(`temp-${i}`)) el(`temp-${i}`).innerHTML = `${d.currentTemp.toFixed(1)}<span class="metric-unit">°C</span>`;
                if (el(`humid-${i}`)) el(`humid-${i}`).innerHTML = `${d.currentHumidity.toFixed(0)}<span class="metric-unit">%</span>`;
                if (el(`co2-${i}`)) el(`co2-${i}`).innerHTML = `${d.co2.toFixed(0)}<span class="metric-unit">ppm</span>`;
                if (el(`light-${i}`)) el(`light-${i}`).innerHTML = `${(d.light / 1000).toFixed(1)}<span class="metric-unit">k lux</span>`;
            });
        }

        function updateStats() {
            const avg = arr => arr.reduce((a, b) => a + b, 0) / arr.length;
            document.getElementById('avgTemp').textContent = avg(ghData.map(d => d.currentTemp)).toFixed(1);
            document.getElementById('avgHumid').textContent = avg(ghData.map(d => d.currentHumidity)).toFixed(0);
            document.getElementById('avgCO2').textContent = avg(ghData.map(d => d.co2)).toFixed(0);
            document.getElementById('avgLight').textContent = avg(ghData.map(d => d.light / 1000)).toFixed(1);
        }

        function updateClock() {
            document.getElementById('currentTime').textContent =
                new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // ===== Simulation =====
        let tickCount = 0;

        function startSimulation() {
            setInterval(() => {
                ghData.forEach((d, i) => {
                    const prevStatus = getZoneStatus(d);
                    d.prevTemp = d.currentTemp;
                    d.prevHumidity = d.currentHumidity;

                    let tempMod = ventMode === 'force' ? -0.5 : ventMode === 'off' ? 0.5 : 0;
                    d.currentTemp += (Math.random() - 0.5) * 0.8 + tempMod;
                    d.currentTemp = clamp(d.currentTemp, d.temp[0] - 3, d.temp[1] + 3);

                    d.currentHumidity += (Math.random() - 0.5) * 3;
                    d.currentHumidity = clamp(d.currentHumidity, d.humidity[0] - 10, d.humidity[1] + 10);

                    d.co2 += (Math.random() - 0.5) * 50;
                    d.co2 = clamp(d.co2, 300, 1000);

                    d.light += (Math.random() - 0.5) * 2000;
                    d.light = clamp(d.light, 5000, 30000);

                    const currentStatus = getZoneStatus(d);
                    if (prevStatus === 'normal' && currentStatus !== 'normal') {
                        addAlert(`${d.icon} ${d.name} - ${currentStatus === 'danger' ? '溫度異常' : '溫度偏離理想範圍'}`, currentStatus);
                    }
                });

                recordHistory();
                updateValues();
                updateStats();
                try { updateSparklines(); } catch (e) {}

                tickCount++;
                if (tickCount % 4 === 0) { try { updateChart(); } catch (e) {} }
            }, 1500);

            setInterval(updateClock, 1000);
        }

        // ===== Controls =====
        function setVent(mode) {
            ventMode = mode;
            document.querySelectorAll('.control-buttons .ctrl-btn').forEach(b => b.classList.remove('active'));
            document.querySelector(`.ctrl-btn[onclick="setVent('${mode}')"]`).classList.add('active');
            const labels = { natural: '自然', force: '強制', off: '關閉' };
            document.getElementById('ventMode').textContent = labels[mode];
            addAlert(`通風系統切換為「${labels[mode]}通風」`, 'info');
        }

        function updateMisting(v) { document.getElementById('mistingVal').textContent = `${v}%`; }
        function updateShade(v) { document.getElementById('shadeVal').textContent = `${v}%`; }

        function emergencyStop() {
            setVent('off');
            addAlert('緊急停止：所有設備已關閉', 'danger');
        }

        function exportData() {
            const data = ghData.map(d => ({
                zone: d.name, temp: d.currentTemp.toFixed(1),
                humidity: d.currentHumidity.toFixed(0),
                co2: d.co2.toFixed(0), light: d.light.toFixed(0)
            }));
            console.log('Export data:', data);
            addAlert('數據已匯出至主控台', 'info');
        }

        // ===== Init =====
        function init() {
            ghData = zoneConfig.map(generateZoneData);
            renderZones();
            renderAlerts();
            updateStats();
            updateClock();
            buildZoneButtons();

            try {
                initChart();
            } catch (e) {
                console.warn('Chart.js init failed:', e);
            }

            for (let i = 0; i < 60; i++) {
                ghData.forEach(d => {
                    d.currentTemp += (Math.random() - 0.5) * 0.8;
                    d.currentTemp = clamp(d.currentTemp, d.temp[0] - 2, d.temp[1] + 2);
                    d.currentHumidity += (Math.random() - 0.5) * 2;
                    d.currentHumidity = clamp(d.currentHumidity, d.humidity[0] - 5, d.humidity[1] + 5);
                    d.co2 += (Math.random() - 0.5) * 40;
                    d.co2 = clamp(d.co2, 300, 1000);
                    d.light += (Math.random() - 0.5) * 1500;
                    d.light = clamp(d.light, 5000, 30000);
                });
                recordHistory();
            }

            renderZones();
            try { updateChart(); } catch (e) {}
            startSimulation();
        }

        init();
    </script>
</body>
</html>
